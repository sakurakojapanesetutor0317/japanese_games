<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Expressions Homework</title>
    <style>
        /* パープル基調のデザイン */
        body { font-family: 'Quicksand', sans-serif; background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%); color: #4a148c; text-align: center; padding: 40px 20px; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 480px; width: 100%; background: #ffffff; padding: 40px 30px; border-radius: 32px; box-shadow: 0 10px 25px rgba(123, 31, 162, 0.15); }
        h1 { font-size: 24px; color: #7b1fa2; margin: 0 0 5px 0; }
        .subtitle { font-size: 13px; color: #8e24aa; margin-bottom: 20px; }
        .date-card { background: #fdfafb; border: 2px dashed #ce93d8; border-radius: 24px; padding: 35px 20px; margin-bottom: 25px; }
        #english-display { font-size: 24px; font-weight: bold; color: #4a148c; }
        input[type="text"] { width: 100%; box-sizing: border-box; padding: 16px; font-size: 20px; border: 2px solid #ce93d8; border-radius: 16px; text-align: center; margin-bottom: 20px; }
        .button-group { display: flex; gap: 10px; margin-bottom: 10px; }
        button { flex: 1; padding: 16px; font-size: 14px; border-radius: 16px; border: none; cursor: pointer; font-weight: 700; color: white; transition: 0.2s; }
        #submit-btn { background-color: #7b1fa2; }
        #answer-btn { background-color: #9e9e9e; }
        #next-btn { background-color: #512da8; width: 100%; display: none; }
        .result { font-size: 20px; font-weight: 700; margin-top: 20px; min-height: 80px; color: #4a148c; }
        .explanation { font-size: 16px; color: #6a1b9a; margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>⏰ Time Expressions</h1>
    <div class="subtitle">Type the reading in Hiragana!</div>
    
    <div class="date-card">
        <div id="english-display">--</div>
    </div>
    
    <input type="text" id="user-input" placeholder="Type here in Hiragana..." autocomplete="off">
    
    <div class="button-group" id="action-area">
        <button id="submit-btn" onclick="checkAnswer()">Check ✨</button>
        <button id="answer-btn" onclick="showAnswer()">Answer 💡</button>
    </div>
    <button id="next-btn" onclick="nextQuestion()">Next Question 💖</button>
    
    <div class="result" id="result-message"></div>
    <div id="explanation-text" class="explanation"></div>
    <div class="score" id="score-display"></div>
</div>

<script>
    let questions = [
       { english: "The day before yesterday", answer: ["おととい"], explanation: "一昨日（おととい）" },
        { english: "The morning before last", answer: ["おとといのあさ"], explanation: "一昨日の朝（おとといのあさ）" },
        { english: "The night before last", answer: ["おとといのばん", "おとといのよる"], explanation: "一昨日の晩（おとといのばん）or 一昨日の夜（おとといのよる）" },
        { english: "Yesterday", answer: ["きのう"], explanation: "昨日（きのう）" },
        { english: "Yesterday morning", answer: ["きのうのあさ"], explanation: "昨日の朝（きのうのあさ）" },
        { english: "Last night", answer: ["きのうのばん", "きのうのよる", "さくばん", "さくや"], explanation: "昨日の晩（きのうのばん）or 昨日の夜（きのうのよる）or 昨晩（さくばん）or 昨夜（さくや）" },
        { english: "Today", answer: ["きょう"], explanation: "今日（きょう）" },
        { english: "This morning", answer: ["けさ"], explanation: "今朝（けさ）" },
        { english: "Tonight", answer: ["こんばん", "こんや"], explanation: "今晩（こんばん）or 今夜（こんや）" },
        { english: "Tomorrow", answer: ["あした", "あす"], explanation: "明日（あした／あす）" },
        { english: "Tomorrow morning", answer: ["あしたのあさ"], explanation: "明日の朝（あしたのあさ）" },
        { english: "Tomorrow night", answer: ["あしたのばん", "あしたのよる"], explanation: "明日の晩（あしたのばん）or 明日の夜（あしたのよる）" },
        { english: "The day after tomorrow", answer: ["あさって"], explanation: "明後日（あさって）" },
        { english: "The morning after next", answer: ["あさってのあさ"], explanation: "明後日の朝（あさってのあさ）" },
        { english: "The night after next", answer: ["あさってのばん", "あさってのよる"], explanation: "明後日の晩（あさってのばん）or 明後日の夜（あさってのよる）" },
        { english: "Every day", answer: ["まいにち"], explanation: "毎日（まいにち）" },
        { english: "Every morning", answer: ["まいあさ"], explanation: "毎朝（まいあさ）" },
        { english: "Every night", answer: ["まいばん"], explanation: "毎晩（まいばん）" },
        { english: "The week before last", answer: ["せんせんしゅう"], explanation: "先々週（せんせんしゅう）" },
        { english: "The month before last", answer: ["せんせんげつ"], explanation: "先々月（せんせんげつ）" },
        { english: "The year before last", answer: ["おととし"], explanation: "一昨年（おととし）" },
        { english: "Last week", answer: ["せんしゅう"], explanation: "先週（せんしゅう）" },
        { english: "Last month", answer: ["せんげつ"], explanation: "先月（せんげつ）" },
        { english: "Last year", answer: ["きょねん"], explanation: "去年（きょねん）" },
        { english: "This week", answer: ["こんしゅう"], explanation: "今週（こんしゅう）" },
        { english: "This month", answer: ["こんげつ"], explanation: "今月（こんげつ）" },
        { english: "This year", answer: ["ことし"], explanation: "今年（ことし）" },
        { english: "Next week", answer: ["らいしゅう"], explanation: "来週（らいしゅう）" },
        { english: "Next month", answer: ["らいげつ"], explanation: "来月（らいげつ）" },
        { english: "Next year", answer: ["らいねん"], explanation: "来年（らいねん）" },
        { english: "The week after next", answer: ["さらいしゅう"], explanation: "再来週（さらいしゅう）" },
        { english: "The month after next", answer: ["さらいげつ"], explanation: "再来月（さらいげつ）" },
        { english: "The year after next", answer: ["さらいねん"], explanation: "再来年（さらいねん）" },
        { english: "Every week", answer: ["まいしゅう"], explanation: "毎週（まいしゅう）" },
        { english: "Every month", answer: ["まいつき"], explanation: "毎月（まいつき）" },
        { english: "Every year", answer: ["まいとし"], explanation: "毎年（まいとし）" }
    ];
    let currentIdx = 0;

    function initGame() {
        // 問題をシャッフル
        questions.sort(() => Math.random() - 0.5);
        loadQuestion();
    }

    function loadQuestion() {
        document.getElementById("english-display").innerText = questions[currentIdx].english;
        document.getElementById("user-input").value = "";
        document.getElementById("result-message").innerHTML = "";
        document.getElementById("explanation-text").innerText = "";
        document.getElementById("user-input").disabled = false;
        document.getElementById("action-area").style.display = "flex";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("score-display").innerText = `Question ${currentIdx + 1} / ${questions.length}`;
    }

    function checkAnswer() {
        const input = document.getElementById("user-input").value.trim();
        if (input === "") { alert("空欄では次に進めません！"); return; }
        // 配列に含まれているか確認
        if (questions[currentIdx].answer.includes(input)) {
            document.getElementById("result-message").innerText = "🌸 Correct!";
            finalizeQuestion();
        } else {
            document.getElementById("result-message").innerText = "⭐ Try again! or Check Answer! ⭐";
        }
    }

    function showAnswer() {
        const q = questions[currentIdx];
        document.getElementById("result-message").innerHTML = ` <span style="color:red; font-size:20pt; font-weight:bold;">${q.answer}</span>`;
        document.getElementById("explanation-text").innerText = `${q.explanation}`;
        finalizeQuestion();
    }

    function finalizeQuestion() {
        document.getElementById("user-input").disabled = true;
        document.getElementById("action-area").style.display = "none";
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) loadQuestion();
        else {
            document.getElementById("english-display").innerText = "🏆 Completed!";
            document.getElementById("user-input").style.display = "none";
            document.getElementById("next-btn").style.display = "none";
        }
    }

    // ゲーム開始
    initGame();
</script>
</body>
</html>
